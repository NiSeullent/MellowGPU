name: Build and validate MellowGPU

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native Intel build and host tests
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned dependencies
        run: |
          test -f MacKernelSDK/Library/x86_64/libkmod.a
          test -f Lilu.kext/Contents/Resources/Headers/plugin_start.hpp
          plutil -lint Mellow/Info.plist
      - name: Host policy and Metal evidence tests
        run: |
          python3 tests/product_migration_tests.py
          python3 tests/efi_boot_profiles_tests.py
          python3 Tools/run-host-tests.py --cxx clang++ --out build/host-tests
          python3 Tools/run-native-control-tests.py --cxx clang++ --sanitize --out build/native-control-tests
          python3 Tools/run-probe-control-tests.py --cxx clang++ --sanitize --out build/control-probe-tests
          python3 Tools/run-backend-interface-tests.py --cxx clang++ --sanitize --out build/backend-interface-tests
          python3 Tools/run-metal-runtime-metadata-tests.py --sanitize --sdk "$(xcrun --sdk macosx --show-sdk-path)" --out build/metadata-fixture-tests
          python3 tests/metal_session_tests.py
          python3 tests/acceptance_cli_tests.py
          sh -n Tools/collect-boot-evidence.sh
      - name: Build actual kext with Xcode
        run: |
          python3 Tools/build-mellowgpu-development.py --out build/development-native
      - name: Test evidence parser against the newly built kext
        run: |
          bundle=build/development-native/artifact/MellowGPU.kext
          MELLOW_KEXT_BINARY="$bundle/Contents/MacOS/MellowGPU" python3 tests/metal_evidence_tests.py
          python3 tests/build_macho_validation.py "$bundle/Contents/MacOS/MellowGPU"
          python3 tests/development_package_tests.py --bundle "$bundle"
      - name: Compile Intel Metal probe
        run: |
          xcrun swiftc -swift-version 5 -O -target x86_64-apple-macos13.0 Tools/metal-probe.swift -o build/metal-probe -framework Metal -framework IOKit -framework CryptoKit
      - name: Compile public IOKit diagnostic client
        run: |
          xcrun clang -std=c11 -Wall -Wextra -Werror Userspace/tahoe_diag_client.c -framework IOKit -framework CoreFoundation -o build/tahoe-diag-client
      - name: Compile universal public IOKit control client
        run: |
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -arch x86_64 -arch arm64 -mmacosx-version-min=13.0 Userspace/mellowgpu-control.cpp -framework IOKit -framework CoreFoundation -o build/mellowgpu-control
      - name: Package native artifacts
        run: |
          python3 Tools/package-mellowgpu-development.py \
            --bundle build/development-native/artifact/MellowGPU.kext \
            --structural-report build/development-native/structural-report.json \
            --build-evidence build/development-native/build-result.json \
            --out build/development-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MellowGPU-native-development
          path: |
            build/development-package/MellowGPU-*.zip
            build/development-package/MellowGPU-*.zip.sha256
            build/development-package/package-result.json
            build/development-native/*.stdout
            build/development-native/*.stderr
            build/development-native/*.json
            build/metal-probe
            build/tahoe-diag-client
            build/mellowgpu-control
            build/native-control-tests/native-control-tests.json
            build/control-probe-tests/probe-control-tests.json
            build/backend-interface-tests/backend-interface-tests.json
            build/metadata-fixture-tests/metadata-fixture-result.json
            build/host-tests/host-tests.json
          if-no-files-found: error
