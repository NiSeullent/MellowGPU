name: MellowGPU initial specification contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check versioned contracts and exact selected-source index
        run: |
          mkdir -p "$RUNNER_TEMP/mellowgpu-spec"
          python3 Tools/mellowgpu-spec.py check > "$RUNNER_TEMP/mellowgpu-spec/check.json"
          python3 -m unittest discover -s tests -p specification_tests.py -v
          python3 tests/backend_interface_runner_tests.py -v
      - name: Execute real metadata-only vendor interfaces
        run: python3 Tools/run-backend-interface-tests.py --cxx g++ --sanitize --out "$RUNNER_TEMP/mellowgpu-spec/backend"
      - name: Execute portable AMD and NVIDIA units with fatal sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:exitcode=86
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          clang++ --version
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic -fno-exceptions -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I. tests/native_amd_packet_tests.cpp Drivers/NativeAmd/PacketEncoding.cpp -o "$RUNNER_TEMP/mellowgpu-spec/amd-packets"
          "$RUNNER_TEMP/mellowgpu-spec/amd-packets" | tee "$RUNNER_TEMP/mellowgpu-spec/amd-packets.log"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic -fno-exceptions -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I. tests/native_nvidia_lifecycle_tests.cpp Drivers/NativeGpu/MemoryOwner.cpp Drivers/NativeNvidia/GpFifoQueue.cpp Drivers/NativeNvidia/CopyPushbuffer.cpp Drivers/NativeNvidia/QueueLifecycle.cpp Drivers/PortedNvidia/CommandEncoding.cpp -o "$RUNNER_TEMP/mellowgpu-spec/nvidia-lifecycle"
          "$RUNNER_TEMP/mellowgpu-spec/nvidia-lifecycle" | tee "$RUNNER_TEMP/mellowgpu-spec/nvidia-lifecycle.log"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic -fno-exceptions -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I. tests/native_nvidia_queue_tests.cpp Drivers/NativeGpu/MemoryOwner.cpp Drivers/NativeNvidia/GpFifoQueue.cpp Drivers/PortedNvidia/CommandEncoding.cpp -o "$RUNNER_TEMP/mellowgpu-spec/nvidia-queue"
          "$RUNNER_TEMP/mellowgpu-spec/nvidia-queue" | tee "$RUNNER_TEMP/mellowgpu-spec/nvidia-queue.log"
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic -fno-exceptions -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -I. tests/native_nvidia_copy_pushbuffer_tests.cpp Drivers/NativeGpu/MemoryOwner.cpp Drivers/NativeNvidia/GpFifoQueue.cpp Drivers/NativeNvidia/CopyPushbuffer.cpp Drivers/PortedNvidia/CommandEncoding.cpp -o "$RUNNER_TEMP/mellowgpu-spec/nvidia-copy"
          "$RUNNER_TEMP/mellowgpu-spec/nvidia-copy" | tee "$RUNNER_TEMP/mellowgpu-spec/nvidia-copy.log"
          nm "$RUNNER_TEMP/mellowgpu-spec/amd-packets" > "$RUNNER_TEMP/mellowgpu-spec/amd-symbols.txt"
          nm "$RUNNER_TEMP/mellowgpu-spec/nvidia-lifecycle" > "$RUNNER_TEMP/mellowgpu-spec/nvidia-symbols.txt"
          nm "$RUNNER_TEMP/mellowgpu-spec/nvidia-queue" > "$RUNNER_TEMP/mellowgpu-spec/queue-symbols.txt"
          nm "$RUNNER_TEMP/mellowgpu-spec/nvidia-copy" > "$RUNNER_TEMP/mellowgpu-spec/copy-symbols.txt"
          python3 - "$RUNNER_TEMP/mellowgpu-spec" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          for name in ('amd', 'nvidia', 'queue', 'copy'):
              text = (root / (name + '-symbols.txt')).read_text()
              assert re.search(r'\b_+asan_init\b', text), name + ': ASan instrumentation missing'
              assert re.search(r'\b_+ubsan_handle_', text), name + ': UBSan instrumentation missing'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mellowgpu-initial-contract-evidence
          path: ${{ runner.temp }}/mellowgpu-spec/
          if-no-files-found: error
